name: Linux build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        cross_tool: [ "m68k-atari-mint" ]
    steps:
      - uses: actions/checkout@v4
      - name: Setup environment
        env:
          CROSS_TOOL: ${{ matrix.cross_tool }}
        run: ./.scripts/setup_env.sh
      - name: Install packages
        run: |
          SYSROOT_DIR="/" ./.scripts/install-freemint.sh binutils gcc mintbin
          ./.scripts/install-freemint.sh mintlib gemlib cflib fdlibm
          ./.scripts/install-libs.sh libpng-1.6.34-mint-dev.tar.xz zlib-1.2.12-mint-20220914-dev.tar.xz giflib-5.1.4-mint-dev.tar.xz jpeg-8d-mint-dev.tar.xz
      - name: build
        run: ./.scripts/build.sh
      - name: package
        if: ${{ github.event_name == 'push' }}
        run: ./.scripts/package.sh
      - name: point the rolling tag at this build
        if: ${{ github.event_name == 'push' }}
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest
      - name: publish snapshot
        if: ${{ github.event_name == 'push' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest snapshot
          body: |
            Rolling snapshot of the latest commit on main.
            Permanent link: https://github.com/${{ github.repository }}/releases/download/latest/highwire-latest.zip
          files: |
            ${{ env.DEPLOY_DIR }}/highwire-latest.zip
            ${{ env.DEPLOY_DIR }}/highwire-${{ env.PROJECT_VERSION }}-${{ env.LONG_ID }}.zip
